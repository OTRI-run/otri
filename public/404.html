<!doctype html>

<title>OTRI — Page not found</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;background:#faf9ff;color:#21152f;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
.mark{width:64px;height:64px}
.eyebrow{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:#64748b}
h1{margin:0;font-size:clamp(30px,5vw,50px);font-weight:700;letter-spacing:-.05em;line-height:.98}
p{margin:0;max-width:440px;font-size:14px;line-height:1.6;color:#475569}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.links a{display:inline-block;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none}
.primary{background:#6336b6;color:#fff}
.secondary{background:#fff;color:#21152f;border:1px solid #e2e8f0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:#64748b;word-break:break-all}
</style>
</head>
<body>
<img class="mark" src="/favicon.svg" alt="OTRI"/>
<p class="eyebrow">404 · NOT FOUND</p>
<h1>That page is not here.</h1>
<p>The address may have a typo, or the page moved while OTRI is being built in the open. Here is where things live now.</p>
<code id="where"></code>
<div class="links">
<a class="primary" href="/">Home</a>
<a class="secondary" href="/prototype/#calculator">Calculate a score</a>
<a class="secondary" href="/prototype/#races">Races</a>
<a class="secondary" href="/prototype/#runners">Runners</a>

</div>
<script>document.getElementById('where').textContent = location.pathname + location.search + location.hash</script>
</body>
</html>
