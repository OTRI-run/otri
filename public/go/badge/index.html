<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b1220" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>OTRI</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f7f9fc;color:#0b1220;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}a{color:#2563eb;font-weight:600}</style>
</head>
<body>
<p>Taking you to OTRI… <a href="https://otri.run/prototype/#home">Continue if nothing happens</a>.</p>
<script>
// A referral path OTRI can count: the badge link lands here, the site's own first-party beacon
// records "/go/badge" (see src/lib/analytics.js and api/analytics.py; no cookie, no identifier),
// then the visitor goes on to the page they were promised.
(function () {
  var target = 'https://otri.run/prototype/#home'
  function askedNotToBeCounted() {
    try {
      var dnt = window.doNotTrack || navigator.doNotTrack || navigator.msDoNotTrack
      return navigator.globalPrivacyControl === true || dnt === '1' || dnt === 'yes'
    } catch (e) {
      return false
    }
  }
  function send() {
    var url = 'https://api.otri.run/site/hit'
    var payload = JSON.stringify({ p: '/go/badge', r: document.referrer || '', tz: '' })
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([payload], { type: 'text/plain;charset=UTF-8' }))) return
    } catch (e) {
      // fall through
    }
    try {
      fetch(url, { method: 'POST', body: payload, headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, keepalive: true, mode: 'cors' }).catch(function () {})
    } catch (e) {
      // a page that cannot count is still a page
    }
  }
  if (!askedNotToBeCounted()) send()
  location.replace(target)
})()
</script>
</body>
</html>
