<title>OTRI — Open Trail Running Index · Building in the open</title>
<style>
.otri-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:#f7f9fc;color:#0b1220;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
.otri-boot-mark{width:168px;height:84px}
.otri-boot-far{stroke-dasharray:240;stroke-dashoffset:240;animation:otri-draw-far 2.4s ease-out infinite}
.otri-boot-ridge{stroke-dasharray:240;stroke-dashoffset:240;animation:otri-draw 2.4s cubic-bezier(.4,0,.2,1) infinite}
.otri-boot-summit{transform-origin:82px 32px;transform:scale(0);animation:otri-rise 2.4s cubic-bezier(.2,.8,.2,1) infinite}
.otri-boot-runner{animation:otri-runner 2.4s linear infinite}
.otri-boot-word{position:relative;display:inline-flex;align-items:flex-start;font-weight:900;font-size:30px;line-height:1;letter-spacing:-.045em;color:#17202c}
.otri-boot-i{position:relative;display:inline-block}
.otri-boot-tittle{position:absolute;left:50%;bottom:.63em;width:.32em;transform:translateX(-50%)}
.otri-boot-arrow{width:.33em;height:.33em;margin-left:.06em;margin-top:.08em}
.otri-boot-title{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;animation:otri-pulse 1.6s ease-in-out infinite}
.otri-boot-hint{margin:0;max-width:420px;font-size:13px;line-height:1.6;color:#64748b;opacity:0;animation:otri-appear .4s ease-out 8s forwards}
.otri-boot-hint a{color:#2563eb;font-weight:600}
@keyframes otri-draw{0%{stroke-dashoffset:240}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes otri-draw-far{0%{stroke-dashoffset:240;opacity:0}20%{opacity:1}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes otri-rise{0%,34%{transform:scale(0)}48%{transform:scale(1.08)}56%,100%{transform:scale(1)}}
@keyframes otri-runner{0%,4%{opacity:0}8%,92%{opacity:1}96%,100%{opacity:0}}
@keyframes otri-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes otri-appear{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.otri-boot-far,.otri-boot-ridge{animation:none;stroke-dashoffset:0}.otri-boot-summit{animation:none;transform:none}.otri-boot-runner{display:none}.otri-boot-title{animation:none}}
</style>
</head>
<body>
<div id="root">
<main class="otri-boot" aria-busy="true">
<svg class="otri-boot-mark" viewBox="0 0 168 84" fill="none" aria-hidden="true"><path class="otri-boot-far" d="M4 60 L26 44 L44 53 L64 28 L86 42 L106 30 L128 48 L148 36 L164 46" stroke="#c9d3e0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path class="otri-boot-ridge" d="M4 76 L22 66 L38 71 L56 47 L70 57 L82 32 L98 55 L114 46 L132 62 L148 55 L164 66" stroke="#17202c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path class="otri-boot-summit" d="M82 14 L94 32 H70 Z" fill="#3576f6"/><circle class="otri-boot-runner" r="4" fill="#3576f6"><animateMotion dur="2.4s" repeatCount="indefinite" calcMode="linear" path="M4 76 L22 66 L38 71 L56 47 L70 57 L82 32 L98 55 L114 46 L132 62 L148 55 L164 66"/></circle></svg><div class="otri-boot-word" aria-hidden="true">otr<span class="otri-boot-i">&#305;<svg class="otri-boot-tittle" viewBox="0 0 10 8"><path d="M5 0 10 8H0z" fill="#3576f6"/></svg></span><svg class="otri-boot-arrow" viewBox="0 0 12 12" fill="none" stroke="#3576f6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 9.6 9.6 2.4"/><path d="M4 2.4h5.6V8"/></svg></div>
<p class="otri-boot-title">OTRI is loading</p>
<p class="otri-boot-hint">Still loading? <a href="javascript:location.reload()">Reload the page</a>. If that does not help, the site may be mid-deploy; try again in a minute.</p>
</main>
</div>
<noscript>

<p>Please enable JavaScript and reload the page.</p>
</main>
</noscript>

</html>
