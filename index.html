<meta charset="UTF-8" />

<title>OTRI — Open Trail Running Index · Building in the open</title>
<style>
.otri-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:#f7f9fc;color:#0b1220;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-align:center}
.otri-boot-mark{width:72px;height:72px}
.otri-boot-ring{stroke-dasharray:107;stroke-dashoffset:107;animation:otri-draw 1.6s cubic-bezier(.4,0,.2,1) infinite}
.otri-boot-ridge{stroke-dasharray:40;stroke-dashoffset:40;animation:otri-draw 1.6s .35s cubic-bezier(.4,0,.2,1) infinite}
.otri-boot-trail{stroke-dasharray:24;stroke-dashoffset:24;animation:otri-draw 1.6s .6s cubic-bezier(.4,0,.2,1) infinite}
.otri-boot-word{display:flex;align-items:center;gap:6px;font-weight:700;font-size:26px;letter-spacing:-.09em}
.otri-boot-word svg{width:34px;height:34px}
.otri-boot-title{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;animation:otri-pulse 1.6s ease-in-out infinite}
.otri-boot-hint{margin:0;max-width:420px;font-size:13px;line-height:1.6;color:#64748b;opacity:0;animation:otri-appear .4s ease-out 8s forwards}
.otri-boot-hint a{color:#2563eb;font-weight:600}
@keyframes otri-draw{0%{stroke-dashoffset:107}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:.35}}
@keyframes otri-pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes otri-appear{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.otri-boot-ring,.otri-boot-ridge,.otri-boot-trail{animation:none;stroke-dashoffset:0}.otri-boot-title{animation:none}}
</style>
</head>
<body>
<div id="root">
<main class="otri-boot" aria-busy="true">
<svg class="otri-boot-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><defs><linearGradient id="otriBootGrad" x1="5" y1="4" x2="35" y2="37" gradientUnits="userSpaceOnUse"><stop stop-color="#60A5FA"/><stop offset=".48" stop-color="#2563EB"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient></defs><circle class="otri-boot-ring" cx="20" cy="20" r="17" stroke="url(#otriBootGrad)" stroke-width="5"/><path class="otri-boot-ridge" d="M7 26.5 15.5 20l4 2.7L26 16l7 6" stroke="url(#otriBootGrad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path class="otri-boot-trail" d="M9 30c5-6 10-7 17-10" stroke="#2563EB" stroke-width="3.4" stroke-linecap="round"/></svg>
<p class="otri-boot-title">OTRI is loading</p>
<p class="otri-boot-hint">Still loading? <a href="javascript:location.reload()">Reload the page</a>. If that does not help, the site may be mid-deploy; try again in a minute.</p>
</main>
</div>
<noscript>
<main style="max-width:720px;margin:48px auto;padding:0 20px;font-family:Arial,sans-serif;line-height:1.6;color:#0b1220">
<h1>OTRI needs JavaScript to run.</h1>
<p>Please enable JavaScript and reload the page.</p>
</main>
</noscript>
<script type="module" src="./src/main.jsx"></script>
</body>
</html>
