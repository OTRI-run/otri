name: Tests

# The Python suite (API, scoring, measurement, ingestion) against a real Postgres, on every pull
# request and every push to main. Add the "Python tests" job as a required status check in the
# main branch ruleset so nothing reaches production without it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: otri_dev_password
          POSTGRES_DB: otri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/conftest.py forces DATABASE_URL to this value, so the suite can never touch another database
      OTRI_TEST_DATABASE_URL: postgresql://postgres:otri_dev_password@localhost:5432/otri_test
      OTRI_API_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
      RESEND_API_KEY: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
            ingestion/requirements.txt
            course/requirements-terrain.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r course/requirements-terrain.txt
      - name: Run the suite
        run: python -m pytest -q --maxfail=20
