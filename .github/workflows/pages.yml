name: Deploy OTRI website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -d dist/assets
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/index.html
          test -s dist/prototype/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/prototype/index.html
          echo "Pages artifact looks valid and uses relative asset paths."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
