name: Deploy OTRI website

# The build job runs on every pull request too, so a pull request shows whether the site still
# builds before it is merged; only a push to main deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_OTRI_API_BASE_URL: https://api.otri.run
  # Optional browser error reporting: set the VITE_SENTRY_DSN repository variable (Settings,
  # Secrets and variables, Actions, Variables). Empty means the SDK is never loaded.
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -d dist/assets
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/index.html
          test -s dist/prototype/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/prototype/index.html
          test -s dist/prototype/organizer/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/prototype/organizer/index.html
          echo "Pages artifact looks valid and uses relative asset paths."
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
