name: Deploy OTRI website

# The build job runs on every pull request too, so a pull request shows whether the site still
# builds before it is merged; only a push to main deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_OTRI_API_BASE_URL: https://api.otri.run
  # Optional browser error reporting: set the VITE_SENTRY_DSN repository variable (Settings,
  # Secrets and variables, Actions, Variables). Empty means the SDK is never loaded.
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -d dist/assets
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/index.html
          test -s dist/prototype/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/prototype/index.html
          test -s dist/prototype/organizer/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/prototype/organizer/index.html
          echo "Pages artifact looks valid and uses relative asset paths."
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
