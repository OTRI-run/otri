name: Deploy OTRI website

# The build job runs on every pull request too, so a pull request shows whether the site still
# builds before it is merged; only a push to main deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The race and runner pages are built from the API (scripts/site/prerender.mjs), so a race
  # published since the last build has no page until the next one: once a day at the latest,
  # and at once when the API asks (repository_dispatch, sent on publish, unpublish and listing;
  # api/app.py, OTRI_GITHUB_DISPATCH_TOKEN).
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [site-rebuild]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  VITE_OTRI_API_BASE_URL: https://api.otri.run
  # Optional browser error reporting: set the VITE_SENTRY_DSN repository variable (Settings,
  # Secrets and variables, Actions, Variables). Empty means the SDK is never loaded.
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
  # Maintenance mode is normally switched from the admin page and needs no deploy. This is the
  # switch for the day the API itself is down: set the VITE_OTRI_MAINTENANCE repository variable
  # to 1, run this workflow, and every page shows the closed notice whatever the API says. Unset
  # it and run the workflow again to open the site (src/components/Maintenance.jsx).
  VITE_OTRI_MAINTENANCE: ${{ vars.VITE_OTRI_MAINTENANCE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - run: npm run build
      - name: Verify Pages artifact
        run: |
          test -s dist/index.html
          test -d dist/assets
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/index.html
          test -s dist/organizer/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/organizer/index.html
          test -s dist/embed/index.html
          ! grep -Eq '(^|["'\''(=])/(assets|src)/' dist/embed/index.html
          # The old /prototype/ addresses forward to the root (static stubs under public/).
          test -s dist/prototype/index.html
          test -s dist/prototype/organizer/index.html
          test -s dist/prototype/embed/index.html
          test -s dist/privacy/index.html
          test -s dist/faq/index.html
          test -s dist/how-otri-scores/index.html
          test -s dist/sitemap.xml
          test -s dist/opensearch.xml
          echo "Pages artifact looks valid and uses relative asset paths."
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # With the site live, every address in its sitemap is pushed to the search engines that
      # take IndexNow (Bing, DuckDuckGo, Yahoo, Ecosia, Yandex, Naver, Seznam), so a new race
      # page is picked up in hours. The key is public by design: the engines check it against the
      # file of the same name at the site's root (public/<key>.txt). Google reads the sitemap
      # through Search Console instead. A hiccup here never undoes a deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tell search engines which addresses changed (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 39ab71f432335e9f52c801e0382195f1
        run: node scripts/site/indexnow.mjs --all-endpoints
