<style>
.otri-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:#0b131a;color:#e9f2f7;font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;text-align:center;background-image:linear-gradient(rgba(233,242,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(233,242,247,.05) 1px,transparent 1px);background-size:28px 28px}.otri-boot-mark{width:64px;height:64px}.otri-boot-track{width:180px;height:2px;background:rgba(233,242,247,.14);overflow:hidden}.otri-boot-track:after{content:"";display:block;width:38%;height:100%;background:#cbf53f;animation:otri-boot-scan 1.5s cubic-bezier(.5,0,.5,1) infinite}.otri-boot-title{margin:0;font:600 11px "IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase;color:#93a7b4}.otri-boot-hint{margin:0;max-width:420px;font-size:14px;line-height:1.6;color:#93a7b4;opacity:0;animation:otri-boot-appear .4s ease-out 8s forwards}.otri-boot-hint a{color:#cbf53f;font-weight:600}@keyframes otri-boot-scan{from{transform:translateX(-100%)}to{transform:translateX(365%)}}@keyframes otri-boot-appear{to{opacity:1}}@media(prefers-reduced-motion:reduce){.otri-boot-track:after{animation:none;width:100%}.otri-boot-hint{animation:none;opacity:1}}
</style>
